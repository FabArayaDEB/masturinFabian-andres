<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Administrador</title>
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="admin-container">
    <!-- Header -->
    <header class="admin-header">
      <div class="header-content">
        <h1><i class="fas fa-cogs"></i> Panel de Administración</h1>
        <div class="user-info">
          <span id="admin-info"></span>
          <!-- Botón de modo oscuro/claro -->
          <button id="toggle-theme-btn" class="theme-toggle-btn" title="Cambiar tema">
            <i class="fas fa-moon"></i>
          </button>
          <a href="index.html" class="logout-btn">
            <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
          </a>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <div class="admin-main">
      <!-- Sidebar Navigation -->
      <aside class="admin-sidebar">
        <nav class="sidebar-nav">
          <button class="nav-btn active" onclick="mostrarPanel('usuarios')">
            <i class="fas fa-users"></i> Gestionar Usuarios
          </button>
          <button class="nav-btn" onclick="mostrarPanel('reportes')">
            <i class="fas fa-chart-bar"></i> Reportes
          </button>
        </nav>
      </aside>

      <!-- Content Area -->
      <main class="admin-content">
        <!-- 👥 Panel de Gestión de Usuarios -->
        <section id="panel-usuarios" class="panel">
          <div class="panel-header">
            <h2><i class="fas fa-user-plus"></i> Crear Usuario</h2>
          </div>
          
          <form id="usuario-form" class="admin-form">
            <div class="form-grid">
              <div class="form-group">
                <label for="rut"><i class="fas fa-id-card"></i> RUT</label>
                <input type="text" id="rut" placeholder="Ingrese RUT" required>
              </div>
              
              <div class="form-group">
                <label for="correo"><i class="fas fa-envelope"></i> Correo</label>
                <input type="email" id="correo" placeholder="Ingrese correo electrónico" required>
              </div>
              
              <div class="form-group">
                <label for="contraseña"><i class="fas fa-lock"></i> Contraseña</label>
                <input type="password" id="contraseña" placeholder="Ingrese contraseña" required>
              </div>
              
              <div class="form-group">
                <label for="rol"><i class="fas fa-user-tag"></i> Rol</label>
                <select id="rol">
                  <option value="trabajador">Trabajador</option>
                  <option value="admin">Administrador</option>
                </select>
              </div>
            </div>
            
            <div class="form-section">
              <h3><i class="fas fa-file-contract"></i> Contrato</h3>
              <div class="form-grid">
                <div class="form-group">
                  <label for="fecha_inicio"><i class="fas fa-calendar-start"></i> Fecha Inicio</label>
                  <input type="date" id="fecha_inicio" required>
                </div>
                
                <div class="form-group">
                  <label for="fecha_fin"><i class="fas fa-calendar-times"></i> Fecha Fin</label>
                  <input type="date" id="fecha_fin" required>
                </div>
                
                <div class="form-group">
                  <label for="cargo"><i class="fas fa-briefcase"></i> Cargo</label>
                  <input type="text" id="cargo" placeholder="Ingrese cargo" required>
                </div>
                
                <div class="form-group">
                  <label for="sueldo"><i class="fas fa-money-bill-wave"></i> Sueldo</label>
                  <input type="number" id="sueldo" placeholder="Ingrese sueldo" required>
                </div>
                
                <div class="form-group">
                  <label for="tipo_contrato"><i class="fas fa-file-signature"></i> Tipo de Contrato</label>
                  <select id="tipo_contrato">
                    <option value="indefinido">Indefinido</option>
                    <option value="plazo fijo">Plazo Fijo</option>
                  </select>
                </div>
              </div>
            </div>
            
            <button type="submit" class="submit-btn">
              <i class="fas fa-save"></i> Guardar Usuario
            </button>
          </form>

          <div class="panel-header">
            <h2><i class="fas fa-list-alt"></i> Usuarios Registrados</h2>
          </div>
          <div id="usuarios-table" class="table-container"></div>
        </section>

        <!-- 📊 Panel de Reportes -->
        <section id="panel-reportes" class="panel hidden">
          <div class="panel-header">
            <h2><i class="fas fa-chart-bar"></i> Reportes de Asistencia</h2>
          </div>

          <div class="filtros-reportes card">
            <h3><i class="fas fa-filter"></i> Filtros</h3>
            <div class="filter-grid">
              <div class="form-group">
                <label for="tipo-reporte">Tipo de Reporte:</label>
                <select id="tipo-reporte">
                  <option value="todos">Todos</option>
                  <option value="atraso">Atraso</option>
                  <option value="salida anticipada">Salida anticipada</option>
                  <option value="inasistencia">Inasistencia</option>
                </select>
              </div>

              <div class="form-group">
                <label for="fecha-inicio-reporte">Desde:</label>
                <input type="date" id="fecha-inicio-reporte">
              </div>

              <div class="form-group">
                <label for="fecha-fin-reporte">Hasta:</label>
                <input type="date" id="fecha-fin-reporte">
              </div>
            </div>
            
            <button onclick="filtrarReportes()" class="filter-btn">
              <i class="fas fa-search"></i> Filtrar Reportes
            </button>
          </div>

          <div id="tabla-reportes" class="table-container"></div>
        </section>
      </main>
    </div>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
