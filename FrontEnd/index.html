<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - MasturinTimer</title>
  <link rel="stylesheet" href="css/index.css">
</head>
<body>

  <div class="login-container">
    <div class="login-card">

      <!-- Logo MasturinTimer: fondo semitransparente idéntico a la tarjeta -->
      <div class="logo-container">
        <img
          src="images/logo-masturintimer.png"
          alt="Logo MasturinTimer"
          class="logo-img"
        >
      </div>

      <ul id="error-list" class="errors"></ul>

      <form id="login-form" action="#" method="POST">
        <div class="input-group">
          <label for="email">Correo Electrónico:</label>
          <input type="email" id="email" name="email" required autofocus>
        </div>
        <div class="input-group">
          <label for="password">Contraseña:</label>
          <input type="password" id="password" name="password" required>
        </div>
        <button type="submit">Iniciar Sesión</button>
      </form>

      <p class="register-link">
        ¿No tienes una cuenta?
        <a href="register.html">Regístrate aquí</a>
      </p>

    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
