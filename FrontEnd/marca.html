<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gestión de Marcas</title>
  <link rel="stylesheet" href="css/marca.css">
</head>
<body>
  <div class="container">
    <div id="logo-section">
      <img src="images/logo-masturintimer.png" alt="Logo Masturi">
    </div>

    <div id="clock-section">
      <div id="clock">00:00:00</div>
      <div id="date">--/--/----</div>
      <div id="contador-section">
        <h3>Contador activo</h3>
        <div id="contador">00:00:00</div>
      </div>
    </div>

    <div id="marca-section">
      <h2>Registro de Marcas</h2>
      <div id="buttons">
        <button id="entrada">Entrada</button>
        <button id="salida-colacion">Salida a colación</button>
        <button id="entrada-colacion">Entrada de colación</button>
        <button id="salida-turno">Salida del turno</button>
      </div>
      <ul id="registro"></ul>
    </div>
  </div>

  <script src="js/marca.js"></script>
</body>
</html>
