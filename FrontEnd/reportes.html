<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reportes Administrativos</title>
    <link rel="stylesheet" href="css/reportes.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h2>Reportes</h2>
            <select id="tipo-reporte">
                <option value="atrasos">Atrasos</option>
                <option value="salidas">Salidas anticipadas</option>
                <option value="inasistencias">Inasistencias</option>
            </select>
            <input type="date" id="fecha-reporte">
            <button id="btn-filtrar">Filtrar</button>
            <div id="reporte-table"></div>
            <button id="logout-btn">Cerrar Sesión</button>
        </div>
    </div>
    <script src="js/reportes.js"></script>
</body>
</html>
